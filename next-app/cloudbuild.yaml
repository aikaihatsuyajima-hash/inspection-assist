steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/inspection-assist/web:$COMMIT_SHA', .]
  - name: gcr.io/cloud-builders/docker
    args: [push, 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/inspection-assist/web:$COMMIT_SHA']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: [run, deploy, inspection-assist, --image, 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/inspection-assist/web:$COMMIT_SHA', --region, asia-northeast1, --platform, managed, --no-allow-unauthenticated]
images: ['asia-northeast1-docker.pkg.dev/$PROJECT_ID/inspection-assist/web:$COMMIT_SHA']
